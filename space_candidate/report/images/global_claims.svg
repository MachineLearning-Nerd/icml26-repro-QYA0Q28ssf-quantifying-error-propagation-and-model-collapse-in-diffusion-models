<svg xmlns="http://www.w3.org/2000/svg" width="1050" height="470" viewBox="0 0 1050 470">
  <rect width="1050" height="470" fill="#f8fafc"/>
  <text x="50" y="48" font-family="system-ui,sans-serif" font-size="26" font-weight="700" fill="#0f172a">Global claims: one exact floor, one asymptotic contradiction</text>
  <text x="70" y="105" font-family="system-ui,sans-serif" font-size="21" font-weight="700" fill="#065f46">C4 VERIFIED</text>
  <text x="550" y="105" font-family="system-ui,sans-serif" font-size="21" font-weight="700" fill="#991b1b">C5 FALSIFIED as written</text>
  <line x1="500" y1="80" x2="500" y2="420" stroke="#cbd5e1" stroke-width="2"/>
  <g font-family="system-ui,sans-serif">
    <text x="70" y="145" font-size="16" fill="#334155">limsup floors, eta=.5, eps²=.01</text>
    <rect x="90" y="335" width="85" height="35" fill="#34d399"/><rect x="220" y="220" width="85" height="150" fill="#10b981"/><rect x="350" y="120" width="85" height="250" fill="#047857"/>
    <text x="132" y="395" text-anchor="middle" font-size="15" fill="#334155">alpha .1</text><text x="262" y="395" text-anchor="middle" font-size="15" fill="#334155">alpha .5</text><text x="392" y="395" text-anchor="middle" font-size="15" fill="#334155">alpha .9</text>
    <text x="132" y="325" text-anchor="middle" font-size="13" fill="#065f46">1.73e-5</text><text x="262" y="210" text-anchor="middle" font-size="13" fill="#065f46">1.25e-4</text><text x="392" y="110" text-anchor="middle" font-size="13" fill="#065f46">2.78e-4</text>
    <text x="550" y="145" font-size="16" fill="#334155">minimum multiplicative upper constant</text>
    <line x1="575" y1="360" x2="970" y2="360" stroke="#64748b" stroke-width="2"/>
    <line x1="610" y1="330" x2="900" y2="165" stroke="#ef4444" stroke-width="7"/>
    <circle cx="610" cy="330" r="10" fill="#b91c1c"/><circle cx="900" cy="165" r="10" fill="#b91c1c"/>
    <text x="610" y="390" text-anchor="middle" font-size="15" fill="#334155">N=10</text><text x="900" y="390" text-anchor="middle" font-size="15" fill="#334155">N=160</text>
    <text x="610" y="310" text-anchor="middle" font-size="15" fill="#991b1b">26.84</text><text x="900" y="145" text-anchor="middle" font-size="15" fill="#991b1b">1.43×10¹⁵</text>
    <text x="550" y="420" font-size="14" fill="#475569">No fixed finite asymp constant exists:</text>
    <text x="550" y="444" font-size="14" fill="#475569">RHS -&gt; 0 while LHS &gt;= C_bias &gt; 0.</text>
  </g>
</svg>
